services:
  postgres:
    image: postgres:16-alpine
    container_name: modelgate-postgres
    environment:
      POSTGRES_USER: modelgate
      POSTGRES_PASSWORD: modelgate
      POSTGRES_DB: modelgate
    # Off the default port so this can run alongside HookRelay, which owns 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelgate -d modelgate"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: modelgate-redis
    # The cache holds raw completions, so nothing here should outlive the
    # process. No appendonly, no snapshots.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
